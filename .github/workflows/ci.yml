name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build
      - run: zig build tools
      - run: zig build check
      - run: zig build test
      - run: zig build scenarios
      - run: zig build sim-build
