name: ci

on:
  push:
    branches: [main]
  pull_request:

# Builds and tests only: reading the code is all it needs
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig build
      - run: zig build tools
      - run: zig build check
      - run: zig build test
      - run: zig build scenarios
