# Pushing a tag like v0.1.0 builds noface and publishes it as a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # Publishing the release
  id-token: write # Signing the build's provenance
  attestations: write # Storing it, so anyone can check a download came from this build

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig build check
      - run: zig build test
      - run: zig build scenarios
      - run: zig build layouts
      - name: Package
        # One zip per Kindle build.zig ships, and the table of them (KINDLES.md)
        run: zig build package -Dversion="${GITHUB_REF_NAME#v}"
      - name: Checksum
        run: |
          cd zig-out
          sha256sum noface-"${GITHUB_REF_NAME#v}"-*.zip > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: zig-out/noface-*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What this release is, written for it (docs/releases/<version>.md: a release
          # without one isn't published), which zip is for which Kindle, then how to
          # install it, the same each time
          cat "docs/releases/${GITHUB_REF_NAME#v}.md" zig-out/KINDLES.md \
            docs/RELEASE_NOTES.md > notes.md
          gh release create "$GITHUB_REF_NAME" zig-out/noface-"${GITHUB_REF_NAME#v}"-*.zip \
            zig-out/SHA256SUMS \
            --title "noface ${GITHUB_REF_NAME#v}" --notes-file notes.md
