# Pushing a tag like v0.1.0 builds noface and publishes it as a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # Publishing the release
  id-token: write # Signing the build's provenance
  attestations: write # Storing it, so anyone can check a download came from this build

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig build check
      - run: zig build test
      - run: zig build scenarios
      - name: Package
        run: zig build package -Dversion="${GITHUB_REF_NAME#v}"
      - name: Checksum
        run: |
          cd zig-out
          sha256sum "noface-${GITHUB_REF_NAME#v}.zip" > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: zig-out/noface-*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "zig-out/noface-${GITHUB_REF_NAME#v}.zip" \
            zig-out/SHA256SUMS \
            --title "noface ${GITHUB_REF_NAME#v}" --notes-file docs/RELEASE_NOTES.md
