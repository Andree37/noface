# Pushing a tag like v0.1.0 builds noface and publishes it as a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build check
      - run: zig build test
      - run: zig build scenarios
      - name: Package
        run: tools/package.sh "${GITHUB_REF_NAME#v}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "zig-out/noface-${GITHUB_REF_NAME#v}.zip" \
            --title "noface ${GITHUB_REF_NAME#v}" --notes-file docs/RELEASE_NOTES.md
